in -- passage -[P1+P2]- out

in -- hall

hall -[P3]- hall2 -[P4]- altar

P1 plate @passage stone
P2 plate @passage

P3 plate @hall

P4 plate @altar stone

altar -[P4:empty]- backroom

P5 plate @backroom

backroom -- hall3

hall3 -[unladen]- hall2

hall2 -[P4:empty]- hall5

S1 activator @hall5

hall3 -[S1]- passage
