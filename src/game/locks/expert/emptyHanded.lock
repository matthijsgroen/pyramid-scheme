// designed by: Claude
// expert. The way out wants a stone on the plate in the store. The stone and the
// lever lie in the quarry, and the lever opens the store and shuts the quarry behind you. The ziplines between
// quarry and store take no stone: carry the stone out and set it down in the yard before you throw the lever.
in -- yard
yard -[p]- out
yard -[A:a]- quarry
yard -[A]- store
quarry >> store
store >> quarry
A toggle @quarry
p plate @store
rest plate @yard
heap plate @quarry stone
