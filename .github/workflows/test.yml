# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on: [push, pull_request]

jobs:
  check-version:
    runs-on: ubuntu-latest

    outputs:
      will_release: ${{ steps.check_changelog.outputs.will_release }}

    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check changelog for unreleased entries
        id: check_changelog
        run: |
          OUTPUT=$(yarn release --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Nothing in \[Unreleased\]"; then
            echo "will_release=false" >> "$GITHUB_OUTPUT"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            echo "bump_type=" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(echo "$OUTPUT" | grep "^New version" | awk '{print $NF}')
            BUMP_TYPE=$(echo "$OUTPUT" | grep "^Bump type" | awk '{print $4}')
            # Extract the Unreleased section (lines between the Unreleased heading and the next
            # release heading). The keep-a-changelog tool writes headings without brackets
            # (e.g. "## Unreleased", "## 0.24.0 - ..."), so match either style defensively.
            UNRELEASED=$(awk '/^## \[?Unreleased\]?/{started=1; next} started && /^## /{exit} started' CHANGELOG.md | sed '/^[[:space:]]*$/{ N; /^\n$/d }')
            echo "will_release=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
            echo "unreleased_content<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
            echo "$UNRELEASED" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          fi

      - uses: mshick/add-pr-comment@v3
        if: github.base_ref == 'main' && steps.check_changelog.outputs.will_release == 'true'
        with:
          message: |
            After merge, a **new version** of the game will be published

            A **${{ steps.check_changelog.outputs.bump_type }}** bump → version **${{ steps.check_changelog.outputs.new_version }}**

            <details><summary>Unreleased changes</summary>

            ${{ steps.check_changelog.outputs.unreleased_content }}

            </details>

      - uses: mshick/add-pr-comment@v3
        if: github.base_ref == 'main' && steps.check_changelog.outputs.will_release == 'false'
        with:
          message: |
            After merge, **no new version** of the game will be published

            The `[Unreleased]` section in `CHANGELOG.md` is empty.

      - uses: mshick/add-pr-comment@v3
        if: github.base_ref != 'main' && github.base_ref != ''
        with:
          message: |
            This PR does not target `main`, so **no version will be published** upon merge regardless of changelog changes.

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: yarn install
        run: yarn install
      - name: Check types
        run: yarn check-types
      - name: Run lint
        run: yarn lint
      - name: Run tests
        run: yarn test
      - name: Verify floor layouts
        run: yarn verify-floors
      - name: yarn build
        run: yarn build # Checks if build can be produced without issues
