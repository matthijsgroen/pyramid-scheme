name: Preview

# Only by hand, naming the branch: several sessions push in parallel, and a push is not a request to deploy.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to build and publish to the preview
        required: true
        type: string

concurrency:
  group: preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Build
        run: yarn build
        env:
          VITE_BASE: /pyramid-scheme-preview/
          VITE_STORAGE_PREFIX: "preview:"
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - name: Publish to pyramid-scheme-preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          external_repository: matthijsgroen/pyramid-scheme-preview
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
